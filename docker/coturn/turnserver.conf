# Configuração de Referência do Servidor coturn (STUN/TURN)
# Documentação Arquitetural: Seção 9 (Infraestrutura de Rede)

# Portas de Escuta
listening-port=3478
tls-listening-port=5349

# IPs de vinculação
listening-ip=0.0.0.0

# Intervalo de portas para alocação de Relay de Mídia (UDP)
min-port=49152
max-port=65535

# Autenticação e Segurança
realm=webrtc-stream.local
fingerprint
lt-cred-mech
user=webrtcuser:webrtcpass

# Modos de Operação
no-cli
no-tls
no-dtls
stale-nonce
log-file=stdout
